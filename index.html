<style>

:root{--ink:#36566a;--muted:#8299a8;--blue:#78a9c0;--pale:#e8f3f9;--line:#d9e6ed;--paper:#fff;--bg:#f3f8fb;--shadow:0 6px 20px #55788a14}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;padding-bottom:86px}
header{position:sticky;top:0;z-index:5;background:hsl(0 0% calc(var(--lm)*97.3% + var(--lo)) / 0.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:17px 20px 13px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;letter-spacing:.13em;font-size:18px;display:flex;align-items:center;gap:8px}.brand:before{content:"✚";display:inline-grid;place-items:center;width:27px;height:27px;border-radius:9px;background:hsl(calc(var(--h) - 5) calc(var(--ks)*62.5%) calc(var(--lm)*93.7% + var(--lo)));color:var(--ink);font-size:14px;letter-spacing:0}.sub{font-size:9px;letter-spacing:.25em;color:var(--muted);margin-top:5px}
button,.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:12px;padding:11px 14px;font-size:14px;font-weight:650;cursor:pointer}
button.primary{background:var(--blue);border-color:var(--blue);color:white}button.ghost{background:transparent}button.danger{color:#b66e76;border-color:hsl(351.8 40.7% calc(var(--lm)*89.4% + var(--lo)))}
main{max-width:900px;margin:auto;padding:20px 17px 35px}.page-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0 18px}.page-title h1{font-size:21px;margin:0}.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--muted);margin-top:5px}
.panel,.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.panel{padding:17px;margin-bottom:14px}.welcome{padding:25px;background:linear-gradient(135deg,hsl(calc(var(--h) - 5) calc(var(--ks)*62.5%) calc(var(--lm)*93.7% + var(--lo))) 0%,hsl(0 0% calc(var(--lm)*98% + var(--lo))) 72%,hsl(0 0% calc(var(--lm)*100% + var(--lo))) 100%);border:1px solid hsl(calc(var(--h) - 6) calc(var(--ks)*48.8%) calc(var(--lm)*91.6% + var(--lo)));border-radius:22px;box-shadow:var(--shadow);margin:12px 0 25px;position:relative;overflow:hidden}.welcome:after{content:"＋";position:absolute;right:20px;top:10px;font-size:70px;color:var(--faint);opacity:.55;font-weight:200}.welcome h1{font-size:26px;margin:0 0 6px}.welcome p{margin:0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.dept{min-height:112px;text-align:left;padding:17px;border-radius:19px;background:hsl(0 0% calc(var(--lm)*100% + var(--lo)))}.dept .ico{font-size:22px;color:var(--blue);display:block;margin-bottom:12px}.dept strong{display:block;font-size:15px}.dept small{color:var(--muted);letter-spacing:.12em;font-size:10px}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:11px;background:hsl(0 0% calc(var(--lm)*99% + var(--lo)));padding:11px 12px;color:var(--ink);font:inherit;font-size:14px;outline:none}textarea{min-height:84px;resize:vertical}label{display:block;font-size:12px;font-weight:700;color:var(--ink);margin-bottom:5px}.field{min-width:0}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field.full{grid-column:1/-1}.section-label{font-size:12px;letter-spacing:.12em;color:var(--muted);border-bottom:1px solid var(--line);padding:12px 0 7px;margin:8px 0 10px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.toolbar input{flex:1;min-width:160px}
.item-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.char-card{overflow:hidden;cursor:pointer}.char-card img{width:100%;aspect-ratio:1.35;object-fit:cover;display:block;background:var(--pale)}.char-card .meta{padding:12px}.char-card strong{display:block}.muted{color:var(--muted);font-size:12px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.tag{font-size:10px;background:var(--pale);padding:4px 8px;border-radius:20px;color:var(--ink)}.link-button{display:inline-flex;align-items:center;gap:7px;margin:8px 0 2px;padding:9px 13px;border-radius:12px;background:hsl(calc(var(--h) - 4.8) calc(var(--ks)*58.6%) calc(var(--lm)*94.3% + var(--lo)));color:var(--ink);text-decoration:none;font-size:12px;font-weight:700;border:1px solid hsl(calc(var(--h) - 6) calc(var(--ks)*50.9%) calc(var(--lm)*89.6% + var(--lo)))}.link-button:active{opacity:.7}.tiny-note{font-size:11px;color:var(--muted);margin-top:5px}
.bottom{position:fixed;z-index:6;bottom:0;left:0;right:0;background:hsl(0 0% calc(var(--lm)*100% + var(--lo)) / 0.9);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}.bottom button{border:0;background:none;padding:5px 8px;color:var(--muted);font-size:10px;min-width:55px}.bottom button b{display:block;font-size:19px;font-weight:400;margin-bottom:2px}.bottom button.active{color:var(--ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.empty{text-align:center;color:var(--muted);padding:32px 10px;font-size:13px}
.detail-head{display:flex;gap:14px;align-items:center;margin-bottom:15px}.detail-head img{width:100px;height:100px;object-fit:cover;border-radius:16px;background:var(--pale)}.detail-head h2{margin:0 0 5px;font-size:20px}.detail-section{padding:13px 0;border-top:1px solid var(--line)}.detail-section h3{font-size:12px;color:var(--muted);margin:0 0 7px}.detail-section p{white-space:pre-wrap;margin:0;font-size:14px;line-height:1.65}
.thumbrow{display:flex;gap:8px;overflow:auto;margin:8px 0}.thumbrow img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.relation-card{padding:15px;margin-bottom:12px}.relation-pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:9px}.person-chip{min-width:0;text-align:center;background:hsl(0 0% calc(var(--lm)*96.9% + var(--lo)));border:1px solid var(--line);border-radius:15px;padding:10px 6px}.person-chip img{width:58px;height:58px;object-fit:cover;border-radius:50%;display:block;margin:0 auto 7px;background:var(--pale)}.person-chip strong{display:block;font-size:12px;overflow-wrap:anywhere}.relation-mark{font-size:20px;color:var(--blue);text-align:center}.relation-title{text-align:center;font-weight:750;margin:12px 0 4px}.relation-sub{text-align:center;color:var(--muted);font-size:11px}.music-card{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:start;padding:13px;margin-bottom:12px}.music-cover{width:64px;height:64px;border-radius:14px;background:var(--pale);display:grid;place-items:center;color:var(--blue);font-size:27px}.music-card h3{margin:2px 0 4px;font-size:15px}.linked-chars{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.linked-char{display:inline-flex;align-items:center;gap:5px;background:hsl(calc(var(--h) - 4.6) calc(var(--ks)*63.6%) calc(var(--lm)*95.7% + var(--lo)));border:1px solid hsl(calc(var(--h) - 5.1) calc(var(--ks)*48.9%) calc(var(--lm)*90.8% + var(--lo)));border-radius:20px;padding:4px 8px;font-size:11px;color:var(--ink)}.linked-char img{width:22px;height:22px;object-fit:cover;border-radius:50%}.select-note{font-size:11px;color:var(--muted);margin:5px 0 9px}.check-list{display:flex;flex-wrap:wrap;gap:7px}.check-option{display:flex;align-items:center;gap:6px;background:hsl(0 0% calc(var(--lm)*97.5% + var(--lo)));border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px}.check-option input{width:auto;margin:0}.custom-row{display:grid;grid-template-columns:1fr 1.4fr auto;gap:7px;margin:7px 0}.small{font-size:11px;padding:7px 9px}
hr{border:0;border-top:1px solid var(--line);margin:15px 0}
@media(min-width:650px){.item-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.formgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.char-card img{aspect-ratio:1.4}}
@media(max-width:380px){.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.custom-row{grid-template-columns:1fr 1fr}.custom-row button{grid-column:1/-1}}

/* v5 : decorated medical archive skin */
:root{--ink:hsl(calc(var(--h) - 2.5) calc(var(--ks)*34.7%) calc(var(--lm)*28.8% + var(--lo)));--muted:hsl(calc(var(--h) - 4) calc(var(--ks)*19.4%) calc(var(--lm)*58.6% + var(--lo)));--blue:hsl(calc(var(--h) - 5.5) calc(var(--ks)*38.8%) calc(var(--lm)*61.6% + var(--lo)));--pale:hsl(calc(var(--h) - 4.8) calc(var(--ks)*63%) calc(var(--lm)*94.7% + var(--lo)));--line:hsl(calc(var(--h) - 5.2) calc(var(--ks)*43.3%) calc(var(--lm)*88.2% + var(--lo)));--paper:hsl(0 0% calc(var(--lm)*100% + var(--lo)));--bg:hsl(0 0% calc(var(--lm)*96.3% + var(--lo)));--shadow:0 9px 26px hsl(calc(var(--h) - 4.5) calc(var(--ks)*30.3%) calc(var(--lm)*43.3% + var(--lo)) / 0.1),0 2px 5px hsl(calc(var(--h) - 4.5) calc(var(--ks)*30.3%) calc(var(--lm)*43.3% + var(--lo)) / 0);--accent:hsl(calc(var(--h) - 7.1) calc(var(--ks)*43.5%) calc(var(--lm)*75.7% + var(--lo)));--mono:'DM Mono',monospace;--display:'Zen Kaku Gothic New',sans-serif;--body:'Zen Kaku Gothic New',sans-serif}
*{box-sizing:border-box}body{font-family:var(--body);background-color:var(--bg);background-image:radial-gradient(hsl(calc(var(--h) - 5.6) calc(var(--ks)*37.6%) calc(var(--lm)*75.5% + var(--lo))) 0.65px,transparent .65px),linear-gradient(135deg,hsl(0 0% calc(var(--lm)*97.3% + var(--lo))),hsl(calc(var(--h) - 6) calc(var(--ks)*50%) calc(var(--lm)*95.3% + var(--lo))));background-size:17px 17px,100% 100%;letter-spacing:.015em}
header{padding:15px 20px 13px;background:hsl(0 0% calc(var(--lm)*98% + var(--lo)) / 0.9);border-bottom:1px solid hsl(calc(var(--h) - 5.2) calc(var(--ks)*43.3%) calc(var(--lm)*88.2% + var(--lo)));box-shadow:0 4px 18px hsl(calc(var(--h) - 5.7) calc(var(--ks)*32%) calc(var(--lm)*38% + var(--lo)) / 0.1)}

/* ===== MELTY FILE : theme variables / iPhone usability layer ===== */
:root{--h:206;--ks:1;--ah:322;--aks:1;--lm:1;--lo:0%;--ink:#4e8fc7;--muted:#6f9fc8;--faint:#8fb8da;--pink:#efb9df;--pinkd:#d98cc0;--on-blue:#fff;--user-font:'DotGothic16','Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN',sans-serif}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body[data-font] *,body[data-font] *::before,body[data-font] *::after{font-family:var(--user-font)!important}
body{-webkit-tap-highlight-color:transparent;padding-bottom:calc(98px + env(safe-area-inset-bottom));overflow-x:hidden}
button,a,select,label,summary{touch-action:manipulation}
img{max-width:100%}
header{padding-top:calc(13px + env(safe-area-inset-top));padding-left:calc(16px + env(safe-area-inset-left));padding-right:calc(16px + env(safe-area-inset-right))}
main{padding-left:max(13px,env(safe-area-inset-left));padding-right:max(13px,env(safe-area-inset-right))}
.bottom{padding-left:max(4px,env(safe-area-inset-left));padding-right:max(4px,env(safe-area-inset-right))}
input,textarea,select{font-size:16px!important;min-height:46px}
textarea{min-height:110px}
input[type=file]{min-height:0;padding:10px}
input[type=color]{padding:3px;height:48px;min-height:48px;cursor:pointer}
.check-option input,input[type=checkbox]{width:22px;height:22px;min-height:0;flex:0 0 22px}
button{min-height:44px;font-size:13px}
button.small{min-height:38px}
.bottom button{min-height:50px}
.count-cell{min-height:0}
button.primary{color:var(--on-blue)!important}
.bottom button{color:var(--muted)}
.bottom button b{color:inherit}
.bottom button.active{color:var(--ink)}
.detail-section p,.relation-title,.music-card h3,.char-card strong,.page-title h1{overflow-wrap:anywhere}
.welcome{padding-bottom:34px}
.thumbrow>div{flex:0 0 auto;text-align:center}
.thumbrow img{cursor:zoom-in}
.detail-head img,.latest-row img{cursor:zoom-in}
.link-host{margin:2px 0 6px}
@media(prefers-reduced-motion:reduce){.ticker span{animation:none}.cursor-spark{display:none}}
/* settings: design customize */
.swatches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:6px 0 12px}
.swatch{padding:8px 4px 6px;min-height:0;display:flex;flex-direction:column;align-items:center;gap:5px;border-radius:14px}
.swatch i{display:block;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--sw) 0 58%,var(--sw2) 58% 100%);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.14)}
.swatch small{font-size:9px;line-height:1.2;text-align:center;overflow-wrap:anywhere}
.swatch.on{box-shadow:0 0 0 3px var(--blue)}
.color-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.ov-state{font-weight:400;font-size:10px;opacity:.75;margin-left:4px}
.font-sample{margin:10px 0 4px;padding:12px;border-radius:12px;border:1px dashed var(--line);background:var(--pale);font-size:15px;line-height:1.7;overflow-wrap:anywhere}
.font-sample b{font-size:20px}
.inline-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:200;max-width:88vw;padding:10px 16px;border-radius:14px;background:rgba(30,45,60,.92);color:#fff;font-size:13px;line-height:1.5;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:none}
.image-viewer img{touch-action:pinch-zoom}
.storage-bar{height:8px;border-radius:6px;background:var(--pale);border:1px solid var(--line);overflow:hidden;margin:8px 0 4px}
.storage-bar i{display:block;height:100%;background:var(--blue)}
@media(max-width:380px){.swatches{grid-template-columns:repeat(2,minmax(0,1fr))}}
header button.primary{background:var(--blue)!important;border-color:var(--blue)!important;color:var(--on-blue)!important;min-width:48px}
</style>

<script>
const APPEARANCE_KEY='melty_file_appearance_v1';
const LEGACY_APPEARANCE_KEYS=['pixel_archive_appearance_v1'];
const PREF_KEY='melty_file_prefs_v1';
const defaultAppearance={theme:'blue',custom:'#70b5ed',accent:'',bg:'',ink:'',night:false,font:'pixel',customFont:''};
let appearance={...defaultAppearance};
let prefs={imgMax:2400};
const themePresets={
 blue:{label:'ソーダブルー',base:'#70b5ed',accent:'#efb9df'},
 pink:{label:'キャンディピンク',base:'#e9a6cf',accent:'#a8d2f2'},
 purple:{label:'ラベンダー',base:'#b59ae8',accent:'#f3b9d9'},
 mint:{label:'ミント',base:'#83cdb4',accent:'#f3c4d8'},
 yellow:{label:'レモン',base:'#e9c66e',accent:'#f1b4d0'},
 peach:{label:'ピーチ',base:'#f0a58a',accent:'#a9d3ee'},
 cocoa:{label:'ココア',base:'#b58e7c',accent:'#efc3d0'},
 mono:{label:'モノクロ',base:'#929da5',accent:'#d6bccb'}
};
const themeColors=Object.fromEntries(Object.entries(themePresets).map(([k,v])=>[k,v.base]));
const fontPresets={
 pixel:{label:'ドット（平成レトロ）',stack:"'DotGothic16','Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN',sans-serif",g:'DotGothic16'},
 rounded:{label:'丸ゴシック',stack:"'Zen Maru Gothic','Hiragino Maru Gothic ProN',Meiryo,sans-serif",g:'Zen+Maru+Gothic:wght@400;500;700;900'},
 standard:{label:'標準ゴシック',stack:"-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif"},
 mincho:{label:'明朝（Zen Old Mincho）',stack:"'Zen Old Mincho','Hiragino Mincho ProN','Yu Mincho',serif",g:'Zen+Old+Mincho:wght@400;700'},
 pop:{label:'ポップ（はちまるポップ）',stack:"'Hachi Maru Pop','Hiragino Maru Gothic ProN',sans-serif",g:'Hachi+Maru+Pop'},
 hand:{label:'手書き風（よもぎ）',stack:"'Yomogi','Hiragino Maru Gothic ProN',sans-serif",g:'Yomogi'},
 kiwi:{label:'やわらか丸（キウイ丸）',stack:"'Kiwi Maru','Hiragino Maru Gothic ProN',serif",g:'Kiwi+Maru:wght@400;500'},
 klee:{label:'教科書風（クレー）',stack:"'Klee One','Hiragino Maru Gothic ProN',sans-serif",g:'Klee+One:wght@400;600'},
 custom:{label:'好きなフォント名を入力…'}
};
const fontSuggest=['Hiragino Sans','Hiragino Maru Gothic ProN','Hiragino Mincho ProN','Yu Gothic','Yu Mincho','Noto Sans JP','Noto Serif JP','M PLUS Rounded 1c','Kosugi Maru','Zen Kurenaido','Zen Antique','Dela Gothic One','RocknRoll One','Potta One','Reggae One','Yusei Magic','Shippori Mincho','Sawarabi Gothic','Mochiy Pop One','Stick'];
function clamp(n,a,b){return Math.min(b,Math.max(a,n))}
function hexRgb(hex){let h=String(hex||'#70b5ed').replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');let n=parseInt(h,16);if(isNaN(n))n=0x70b5ed;return [(n>>16)&255,(n>>8)&255,n&255]}
function shade(hex,amount){let [r,g,b]=hexRgb(hex);let t=amount;return '#'+[r,g,b].map(v=>Math.round(v+(255-v)*t).toString(16).padStart(2,'0')).join('')}
function hexToHsl(hex){let [r,g,b]=hexRgb(hex).map(v=>v/255);let mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,h=0,s=0,d=mx-mn;if(d){s=d/(1-Math.abs(2*l-1));if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}return {h,s:s*100,l:l*100}}
function hslToHex(h,s,l){h=((h%360)+360)%360;s=clamp(s,0,100)/100;l=clamp(l,0,100)/100;const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;let rgb=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];return '#'+rgb.map(v=>Math.round((v+m)*255).toString(16).padStart(2,'0')).join('')}
function lumOf(hex){let [r,g,b]=hexRgb(hex).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b}
function currentBase(){return appearance.theme==='custom'?(appearance.custom||'#70b5ed'):(themePresets[appearance.theme]||themePresets.blue).base}
function autoAccent(){if(appearance.theme!=='custom')return (themePresets[appearance.theme]||themePresets.blue).accent;const b=hexToHsl(currentBase());return hslToHex(b.h+116,clamp(b.s,10,70),82)}
function computePalette(){
 const base=currentBase(),bh=hexToHsl(base),accent=appearance.accent||autoAccent(),ah=hexToHsl(accent),night=!!appearance.night;
 const S=clamp(bh.s,20,100);
 const surf=night?{pale:hslToHex(bh.h,S*.45,17),line:hslToHex(bh.h,S*.4,32),bg:hslToHex(bh.h,S*.4,10)}:{pale:hslToHex(bh.h,S,94),line:hslToHex(bh.h,S,83),bg:hslToHex(bh.h,S*.95,95)};
 const tx=night?{ink:hslToHex(bh.h,clamp(bh.s*.8,0,60),88),muted:hslToHex(bh.h,clamp(bh.s*.7,0,55),74),faint:hslToHex(bh.h,clamp(bh.s*.6,0,50),60)}:{ink:hslToHex(bh.h,clamp(bh.s*.75,0,62),40),muted:hslToHex(bh.h,clamp(bh.s*.65,0,55),52),faint:hslToHex(bh.h,clamp(bh.s*.6,0,50),64)};
 const fill=hslToHex(bh.h,clamp(bh.s,0,100),64);
 const onBlue=(night||lumOf(fill)<=.45)?'#fff':hslToHex(bh.h,clamp(bh.s*.6,0,60),16);
 return {base,bh,accent,ah,night,surf,tx,
  ink:appearance.ink||tx.ink,bg:appearance.bg||surf.bg,
  pink:accent,pinkd:night?hslToHex(ah.h,clamp(ah.s*.8,0,70),78):hslToHex(ah.h,clamp(ah.s*.85,0,75),62),onBlue};
}
function ensureFontCss(id,family){if(!family||document.getElementById('gf-'+id))return;const l=document.createElement('link');l.id='gf-'+id;l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+family+'&display=swap';document.head.appendChild(l)}
function cleanFontName(s){try{return String(s||'').replace(/[^\p{L}\p{N}\s\-_.]/gu,'').replace(/\s+/g,' ').trim().slice(0,60)}catch(e){return String(s||'').replace(/[^\w\s\-.]/g,'').trim().slice(0,60)}}
function fontStack(){
 const f=appearance.font||'pixel';
 if(f==='custom'){const n=cleanFontName(appearance.customFont);if(n){ensureFontCss('custom-'+n.replace(/\W/g,'_'),encodeURIComponent(n).replace(/%20/g,'+'));return `'${n}',${fontPresets.pixel.stack}`}return fontPresets.pixel.stack}
 const p=fontPresets[f]||fontPresets.pixel;if(p.g)ensureFontCss(f,p.g);return p.stack;
}
function setIfIdle(id,val){const el=document.getElementById(id);if(el&&document.activeElement!==el&&el.value!==val)el.value=val}
function applyAppearance(){
 const P=computePalette(),r=document.documentElement.style;
 r.setProperty('--h',P.bh.h.toFixed(1));r.setProperty('--ks',clamp(P.bh.s/78,0,1.6).toFixed(3));
 r.setProperty('--ah',P.ah.h.toFixed(1));r.setProperty('--aks',clamp(P.ah.s/63,0,1.6).toFixed(3));
 r.setProperty('--lm',P.night?'-0.6':'1');r.setProperty('--lo',P.night?'70%':'0%');
 r.setProperty('--blue',P.base);r.setProperty('--pale',P.surf.pale);r.setProperty('--line',P.surf.line);r.setProperty('--bg',P.bg);
 r.setProperty('--ink',P.ink);r.setProperty('--muted',P.tx.muted);r.setProperty('--faint',P.tx.faint);
 r.setProperty('--pink',P.pink);r.setProperty('--pinkd',P.pinkd);r.setProperty('--on-blue',P.onBlue);
 r.setProperty('--shadow',`0 5px 0 ${P.surf.line}, 0 10px 20px ${P.base}35`);
 r.setProperty('--user-font',fontStack());
 r.colorScheme=P.night?'dark':'light';
 document.body.dataset.font=appearance.font||'pixel';
 let tm=document.querySelector('meta[name="theme-color"]');if(tm)tm.setAttribute('content',P.bg);
 let style=document.getElementById('userThemeOverrides');if(!style){style=document.createElement('style');style.id='userThemeOverrides';document.head.appendChild(style)}
 let css='';
 if(appearance.bg){const dot=P.night?hslToHex(P.bh.h,30,26):hslToHex(P.bh.h,45,78);css+=`body{background-color:${appearance.bg}!important;background-image:radial-gradient(${dot} 1px,transparent 1.3px)!important;background-size:15px 15px!important}`}
 if(appearance.ink){css+=`body,.brand,.page-title h1,.dashboard-head h2,.dept strong,.muted,.tag,.linked-char,.eyebrow,.sub,label{color:${appearance.ink}!important}`}
 style.textContent=css;
 setIfIdle('themePreset',appearance.theme);
 setIfIdle('customColor',P.base);setIfIdle('accentColor',P.accent);setIfIdle('bgColor',P.bg);setIfIdle('inkColor',P.ink);
 setIfIdle('fontPreset',appearance.font||'pixel');
 const t=(id,on)=>{const e=document.getElementById(id);if(e)e.textContent=on?'（指定中）':'（自動）'};
 t('st-accent',!!appearance.accent);t('st-bg',!!appearance.bg);t('st-ink',!!appearance.ink);
 const nm=document.getElementById('nightMode');if(nm)nm.checked=!!appearance.night;
 const cb=document.getElementById('customFontBox');if(cb)cb.style.display=(appearance.font==='custom')?'block':'none';
 const cn=document.getElementById('customFontName');if(cn&&document.activeElement!==cn)cn.value=appearance.customFont||'';
 document.querySelectorAll('.swatch').forEach(b=>b.classList.toggle('on',b.dataset.theme===appearance.theme));
}
function saveAppearance(){try{localStorage.setItem(APPEARANCE_KEY,JSON.stringify(appearance))}catch(e){}applyAppearance()}
function setThemePreset(value){appearance.theme=value;if(value!=='custom'){appearance.custom=themeColors[value]||themeColors.blue;appearance.accent=''}saveAppearance()}
function setCustomTheme(value){appearance.theme='custom';appearance.custom=value;saveAppearance();const p=document.getElementById('themePreset');if(p)p.value='custom'}
function setAccent(v){appearance.accent=v;saveAppearance()}
function setBgColor(v){appearance.bg=v;saveAppearance()}
function setInkColor(v){appearance.ink=v;saveAppearance()}
function clearOverride(k){appearance[k]='';saveAppearance();const map={accent:'accentColor',bg:'bgColor',ink:'inkColor'};const el=document.getElementById(map[k]);if(el){el.blur();applyAppearance()}}
function setNight(on){appearance.night=!!on;saveAppearance()}
function setFontPreset(value){appearance.font=value;saveAppearance();if(value==='custom'){const e=document.getElementById('customFontName');if(e)setTimeout(()=>e.focus(),50)}}
function applyCustomFont(){const e=document.getElementById('customFontName');if(!e)return;appearance.customFont=cleanFontName(e.value);e.value=appearance.customFont;appearance.font='custom';saveAppearance();toast(appearance.customFont?'フォントを適用しました':'フォント名が空です',1800)}
function resetAppearance(){appearance={...defaultAppearance};saveAppearance();render()}
function loadAppearance(){
 let raw=null;try{raw=localStorage.getItem(APPEARANCE_KEY);if(!raw)for(const k of LEGACY_APPEARANCE_KEYS){raw=localStorage.getItem(k);if(raw)break}}catch(e){}
 try{appearance={...defaultAppearance,...JSON.parse(raw||'{}')}}catch(e){appearance={...defaultAppearance}}
 if(appearance.theme!=='custom'&&!themePresets[appearance.theme])appearance.theme='blue';
 if(!fontPresets[appearance.font])appearance.font='pixel';
 try{prefs={...prefs,...JSON.parse(localStorage.getItem(PREF_KEY)||'{}')}}catch(e){}
 applyAppearance();
}
function savePrefs(){try{localStorage.setItem(PREF_KEY,JSON.stringify(prefs))}catch(e){}}
function setImgMax(v){prefs.imgMax=parseInt(v,10)||0;savePrefs();toast('画像の保存サイズを変更しました（次に追加する画像から適用）',2200)}
let toastTimer=null;
function toast(msg,ms=2200){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}t.textContent=msg;t.style.display='block';clearTimeout(toastTimer);if(ms>0)toastTimer=setTimeout(()=>{t.style.display='none'},ms);return ()=>{t.style.display='none'}}

const DB='melty_file_v1', STORE='data';
const LEGACY_DBS=['pixel_archive_v1','amu_infirmary_v2'];
const EMPTY_DATA=()=>({characters:[],relations:[],worlds:[],music:[],archive:[],archiveFolders:[],archiveImages:[],stickers:[]});
let state={page:'home',data:EMPTY_DATA(),editing:null,detail:null,search:'',archiveFolder:null,draftImages:[],saving:false};
function uid(){try{if(window.crypto&&crypto.randomUUID)return crypto.randomUUID()}catch(e){}return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6)}
function normalizeData(d){const o=EMPTY_DATA();if(d&&typeof d==='object')for(const k of Object.keys(o))if(Array.isArray(d[k]))o[k]=d[k].filter(x=>x&&typeof x==='object');return o}
function hasContent(d){return !!d&&Object.keys(EMPTY_DATA()).some(k=>Array.isArray(d[k])&&d[k].length)}
function dbOpen(name=DB){return new Promise((res,rej)=>{let r=indexedDB.open(name,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function dbGetMain(d){return new Promise((res,rej)=>{let r=d.transaction(STORE).objectStore(STORE).get('main');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function legacyRead(name){return new Promise(resolve=>{let req;try{req=indexedDB.open(name)}catch(e){resolve(null);return}
 req.onupgradeneeded=e=>{try{e.target.transaction.abort()}catch(x){}};
 req.onerror=()=>resolve(null);req.onblocked=()=>resolve(null);
 req.onsuccess=()=>{const d=req.result;try{if(!d.objectStoreNames.contains(STORE)){d.close();resolve(null);return}
  const g=d.transaction(STORE).objectStore(STORE).get('main');g.onsuccess=()=>{d.close();resolve(g.result||null)};g.onerror=()=>{d.close();resolve(null)}}catch(e){try{d.close()}catch(x){}resolve(null)}}})}
async function load(){
 let migrated=null;
 try{
  let d=await dbOpen();let v=await dbGetMain(d);d.close();
  if(v){state.data=normalizeData(v)}
  else{for(const name of LEGACY_DBS){const lv=await legacyRead(name);if(hasContent(lv)){state.data=normalizeData(lv);migrated=name;break}}
   if(migrated)await save()}
 }catch(e){console.log(e)}
 render();
 if(migrated)toast('以前のデータ（'+(migrated==='pixel_archive_v1'?'PIXEL ARCHIVE':'AMU INFIRMARY')+'）を引き継ぎました',4000);
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
}
async function save(){try{let d=await dbOpen();await new Promise((res,rej)=>{let t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(state.data,'main');t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});d.close();return true}catch(e){console.error(e);alert('保存に失敗しました。端末の空き容量や、プライベートブラウズ設定を確認してください。\n先にバックアップの書き出しをおすすめします。');return false}}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(p){state.page=p;state.detail=null;state.editing=null;state.search='';state.archiveFolder=null;render()}
function pageTitle(a,b,btn=''){return `<div class="page-title"><div><h1>${a}</h1><div class="eyebrow">${b}</div></div>${btn}</div>`}
/* ---------- images ---------- */
function readAsDataURL(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file)})}
function loadImageEl(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u})}
function canvasHasAlpha(cv){try{const s=document.createElement('canvas');s.width=s.height=48;const c=s.getContext('2d');c.drawImage(cv,0,0,48,48);const d=c.getImageData(0,0,48,48).data;for(let i=3;i<d.length;i+=4)if(d[i]<250)return true}catch(e){return true}return false}
async function fileToData(file,opts={}){
 const max=opts.max===undefined?prefs.imgMax:opts.max;
 const type=(file.type||'').toLowerCase();
 if(!max||!/^image\/(jpeg|jpg|png|webp|heic|heif)$/.test(type))return readAsDataURL(file);
 try{
  const im=await loadImageEl(file);const w=im.naturalWidth,h=im.naturalHeight;
  if(!w||!h)return readAsDataURL(file);
  const scale=Math.min(1,max/Math.max(w,h));
  if(scale>=1&&file.size<1.5*1024*1024)return readAsDataURL(file);
  const cw=Math.max(1,Math.round(w*scale)),ch=Math.max(1,Math.round(h*scale));
  const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;cv.getContext('2d').drawImage(im,0,0,cw,ch);
  const keepAlpha=(type==='image/png'||type==='image/webp')&&canvasHasAlpha(cv);
  const out=keepAlpha?cv.toDataURL('image/png'):cv.toDataURL('image/jpeg',0.9);
  cv.width=cv.height=1;
  if(scale>=1&&out.length>file.size*1.37)return readAsDataURL(file);
  return out.startsWith('data:image')?out:readAsDataURL(file);
 }catch(e){return readAsDataURL(file)}
}
function openViewer(src){if(!src)return;let layer=document.createElement('div');layer.className='image-viewer';layer.style.cssText='position:fixed;inset:0;z-index:120;background:rgba(30,50,66,.82);display:grid;place-items:center;padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))';layer.innerHTML=`<div style="max-width:95vw;max-height:90vh;background:var(--paper,#fff);padding:8px;border:3px solid #fff;border-radius:18px;box-shadow:0 5px 0 var(--line)"><img src="${src}" style="display:block;max-width:85vw;max-height:74vh;object-fit:contain;border-radius:10px;margin:auto"><button style="width:100%;margin-top:8px" onclick="this.closest('.image-viewer').remove()">とじる　♡</button></div>`;layer.addEventListener('click',e=>{if(e.target===layer)layer.remove()});document.body.appendChild(layer)}
/* ---------- list rendering with search (keeps keyboard open on iPhone) ---------- */

/* ---------- music links: any URL ---------- */
const LINK_SCHEMES=['https:','http:','spotify:','music:','youtube:','youtubemusic:','nicovideo:'];
function normalizeUrl(raw){
 let s=String(raw||'').trim();if(!s)return '';
 if(/^[a-z][a-z0-9+.\-]*:/i.test(s)&&!/^[a-z0-9.\-]+:\d+(\/|$)/i.test(s)){try{const u=new URL(s);return LINK_SCHEMES.includes(u.protocol.toLowerCase())?u.href:''}catch(e){return ''}}
 if(s.startsWith('//'))s='https:'+s;
 if(/\s/.test(s)||!/^[^\s\/]+\.[^\s\/]{2,}|^localhost/i.test(s))return '';
 if(!/^https?:\/\//i.test(s))s='https://'+s;
 try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:''}catch(e){return ''}
}
const SERVICES=[[/(^|\.)spotify\.com$|(^|\.)spotify\.link$/,'Spotify'],[/(^|\.)youtube\.com$|(^|\.)youtu\.be$/,'YouTube'],[/^music\.apple\.com$|(^|\.)itunes\.apple\.com$|^geo\.music\.apple\.com$/,'Apple Music'],[/(^|\.)soundcloud\.com$|^on\.soundcloud\.com$/,'SoundCloud'],[/(^|\.)nicovideo\.jp$|^nico\.ms$/,'ニコニコ動画'],[/(^|\.)bandcamp\.com$/,'Bandcamp'],[/^music\.amazon\.|^amazon\.(co\.jp|com)$|^amzn\./,'Amazon Music'],[/^music\.line\.me$|^lin\.ee$/,'LINE MUSIC'],[/(^|\.)awa\.fm$/,'AWA'],[/(^|\.)deezer\.com$/,'Deezer'],[/(^|\.)tidal\.com$/,'TIDAL'],[/(^|\.)twitter\.com$|^x\.com$/,'X'],[/(^|\.)instagram\.com$/,'Instagram'],[/(^|\.)tiktok\.com$/,'TikTok'],[/(^|\.)vimeo\.com$/,'Vimeo']];
function linkInfo(raw){const href=normalizeUrl(raw);if(!href)return null;let host='';try{const u=new URL(href);host=u.protocol.startsWith('http')?u.hostname.replace(/^www\./,'').toLowerCase():u.protocol.replace(':','')+'://'}catch(e){return null}
 if(href.startsWith('spotify:'))return {href:esc(href),label:'Spotifyで開く',host:'spotify'};
 for(const [re,name] of SERVICES)if(re.test(host))return {href:esc(href),label:name+'で開く',host};
 return {href:esc(href),label:'リンクを開く',host}}
function safeUrl(raw){const i=linkInfo(raw);return i?i.href:''}
function musicLinkHTML(raw){const i=linkInfo(raw);if(!i)return String(raw||'').trim()?`<div class="tiny-note">⚠ このリンクは開けません：${esc(raw)}</div>`:'';return `<a class="link-button" href="${i.href}" target="_blank" rel="noopener noreferrer">♫ ${esc(i.label)} ↗</a><div class="tiny-note link-host">${esc(i.host)}</div>`}

function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`}

async function backup(){try{let blob=new Blob([backupJSON()],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`MELTY-FILE-backup-${stamp()}.json`;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},4000);toast('バックアップを書き出しました',2500)}catch(e){alert('書き出しに失敗しました')}}
async function shareBackup(){try{const file=new File([backupJSON()],`MELTY-FILE-backup-${stamp()}.json`,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'MELTY FILE バックアップ'})}else{alert('この端末では共有シートを使えません。「バックアップを書き出す」をお使いください。')}}catch(e){if(e&&e.name!=='AbortError')alert('共有に失敗しました。「バックアップを書き出す」をお試しください。')}}
async function restore(file){if(!file)return;try{let d=JSON.parse(await file.text());if(!d||typeof d!=='object'||!Object.keys(EMPTY_DATA()).some(k=>Array.isArray(d[k])))throw new Error('format');if(!confirm('現在のデータをバックアップの内容に置き換えます。よろしいですか？'))return;for(let k of Object.keys(state.data))if(Array.isArray(d[k]))state.data[k]=d[k].filter(x=>x&&typeof x==='object');if(d._appearance&&typeof d._appearance==='object'){appearance={...defaultAppearance,...d._appearance};if(appearance.theme!=='custom'&&!themePresets[appearance.theme])appearance.theme='blue';if(!fontPresets[appearance.font])appearance.font='pixel';saveAppearance()}const ok=await save();if(ok){alert('復元しました');}render()}catch(e){alert('読み込みに失敗しました。MELTY FILE / PIXEL ARCHIVE / AMU INFIRMARY のバックアップ（.json）を選んでください。')}}

 <section class="dashboard-head"><div><div class="eyebrow">♡ MENU / CONTENTS ♡</div><h2>創作メニュー</h2></div><span class="sticker-mini">OPEN!</span></section>
 <div class="grid home-grid">${[['♙','キャラクター','CHARACTER FILE','characters'],['♡','関係性','RELATION CHART','relations'],['✧','世界観','WORLD RECORD','worlds'],['♫','音楽','MUSIC ARCHIVE','music'],['▤','資料室','ILLUSTRATION BOX','archive'],['⚙','設定','MY ROOM','settings']].map(x=>`<button class="dept" onclick="go('${x[3]}')"><span class="ico">${x[0]}</span><strong>${x[1]}</strong><small>${x[2]}</small><i>OPEN ↗</i></button>`).join('')}</div>
 <section class="panel home-gallery"><div class="panel-heading"><span>★ MY ILLUSTRATION FILES</span><b>最近追加したイラスト</b></div>${gallery.length?`<div class="home-gallery-grid">${gallery.map(im=>`<button onclick="go('archive');state.archiveFolder='${im.folderId}';render()"><img src="${im.data}" alt="${esc(im.name||'イラスト')}"></button>`).join('')}</div>`:'<div class="gallery-empty">♡ ここには資料室に追加したイラストが表示されます ♡<br>まずはキャラクター別フォルダに画像を追加してね</div>'}<button class="mini-link" onclick="go('archive')">資料室をひらく　♡</button></section>
 <div class="dashboard-columns"><section class="panel count-panel"><div class="panel-heading"><span>♡ STORAGE STATUS</span><b>登録数</b></div><div class="count-grid">${counts.map(x=>`<button class="count-cell" onclick="go('${x[2]}')"><span>${x[3]}</span><b>${x[1]}</b><small>${x[0]}</small></button>`).join('')}</div></section><section class="panel latest-panel"><div class="panel-heading"><span>✧ RECENT FILES</span><b>最近のキャラクター</b></div>${latest.length?latest.map(c=>`<button class="latest-row" onclick="go('characters');state.detail='${c.id}';render()">${c.images?.[0]?`<img src="${c.images[0]}">`:'<span class="latest-placeholder">♡</span>'}<span><b>${esc(c.name||'NO NAME')}</b><small>${esc(c.reading||'CHARACTER FILE')}</small></span><i>↗</i></button>`).join(''):'<div class="empty compact-empty">キャラクターはまだ登録されていません ♡</div>'}<button class="mini-link" onclick="go('characters')">キャラクター一覧を見る　♡</button></section></div>`;return}
 if(state.page==='characters'){if(state.detail){renderCharacterDetail();return}a.innerHTML=pageTitle('キャラクター','CHARACTER DIRECTORY',`<button class="primary" onclick="openForm()">＋ 新規登録</button>`)+`<div class="toolbar"><input id="searchBox" placeholder="名前・タグ・MBTIで検索…" autocomplete="off" enterkeyhint="search" value="${esc(state.search)}" oninput="onSearch(this.value)"></div><div id="listArea">${charListHTML()}</div>`;return}
 if(state.page==='archive'){renderArchive();return}
 if(state.page==='relations'||state.page==='worlds'||state.page==='music'){renderCollection();return}
 if(state.page==='settings'){a.innerHTML=settingsHTML();applyAppearance();refreshStorageInfo();return}
}
const fields=[['基本','name','名前'],['','reading','読み方'],['','alias','愛称'],['','gender','性別'],['','age','年齢'],['','birthday','誕生日'],['','height','身長'],['','species','種族'],['','occupation','職業・所属'],['','mbti','MBTI'],['外見','hair','髪'],['','eyes','目'],['','appearance','外見・服装'],['性格・設定','personality','性格'],['','speech','口調・一人称'],['','likes','好きなもの'],['','dislikes','苦手なもの'],['','ability','能力・特技'],['','past','過去・経歴'],['','secret','秘密・補足']];
function inputField(f,c,multi=false){let [section,key,label]=f;let val=c[key]||'';let isLong=['appearance','personality','speech','likes','dislikes','ability','past','secret'].includes(key);return `<div class="field ${isLong?'full':''}"><label>${label}</label>${isLong?`<textarea name="${key}" placeholder="${label}">${esc(val)}</textarea>`:`<input name="${key}" value="${esc(val)}" placeholder="${label}">`}</div>`}
function customRow(k='',v='',i=''){return `<div class="custom-row"><input placeholder="項目名" value="${esc(k)}"><input placeholder="内容" value="${esc(v)}"><button type="button" class="small danger" onclick="this.parentNode.remove()">削除</button></div>`}
function addCustom(){document.getElementById('customFields').insertAdjacentHTML('beforeend',customRow())}
function renderArchive(){
 let a=document.getElementById('app');let folders=state.data.archiveFolders||[];let images=state.data.archiveImages||[];
 if(state.archiveFolder){let f=folders.find(x=>x.id===state.archiveFolder);if(!f){state.archiveFolder=null;renderArchive();return}let list=images.map((x,i)=>({...x,index:i})).filter(x=>x.folderId===f.id).reverse();a.innerHTML=pageTitle(esc(f.name),'ILLUSTRATION FOLDER',`<button onclick="state.archiveFolder=null;renderArchive()">フォルダ一覧</button>`)+`<div class="toolbar"><button class="primary" onclick="document.getElementById('archiveUpload').click()">♡ 画像を追加</button><input id="archiveUpload" type="file" accept="image/*" multiple hidden onchange="uploadArchiveImages('${f.id}',this.files)"><button onclick="renameArchiveFolder('${f.id}')">名前変更</button><button class="danger" onclick="deleteArchiveFolder('${f.id}')">フォルダ削除</button></div>${list.length?`<div class="archive-images">${list.map(x=>`<div class="archive-image"><img src="${x.data}" alt="${esc(x.name||'イラスト')}" onclick="openArchiveImage(${x.index})"><button class="danger" onclick="deleteArchiveImage(${x.index})">画像を削除</button></div>`).join('')}</div>`:'<div class="gallery-empty">♡ このフォルダはまだ空です ♡<br>イラストを追加してね</div>'}`;return}
 a.innerHTML=pageTitle('資料室','CHARACTER ILLUSTRATION FILES',`<button class="primary" onclick="createArchiveFolder()">＋ フォルダ作成</button>`)+`<div class="error-window"><div class="error-titlebar"><span>ARCHIVE.EXE　—　画像資料室</span><span class="window-dots"><i></i><i></i><i></i></span></div><div class="error-content"><div class="error-icon">▣</div><p><strong>キャラクターごとにイラストを保管できます。</strong><br>フォルダを作って、その子の画像をまとめて追加してください。</p></div></div>${folders.length?`<div class="folder-grid">${folders.map(f=>`<button class="folder-card" onclick="state.archiveFolder='${f.id}';renderArchive()"><span class="folder-ico">📁</span><strong>${esc(f.name)}</strong><small>${images.filter(im=>im.folderId===f.id).length} images　♡</small></button>`).join('')}</div>`:'<div class="gallery-empty">♡ まだフォルダがありません ♡<br>「フォルダ作成」からキャラクター名で作ってね</div>'}`;
}
function renameArchiveFolder(id){let f=state.data.archiveFolders.find(x=>x.id===id);if(!f)return;let name=prompt('新しいフォルダ名',f.name);if(!name||!name.trim())return;f.name=name.trim();save().then(render)}
async function deleteArchiveFolder(id){if(!confirm('フォルダと中の画像を削除しますか？'))return;state.data.archiveFolders=state.data.archiveFolders.filter(x=>x.id!==id);state.data.archiveImages=state.data.archiveImages.filter(x=>x.folderId!==id);state.archiveFolder=null;await save();render()}
async function deleteArchiveImage(index){if(!confirm('この画像を削除しますか？'))return;state.data.archiveImages.splice(index,1);await save();renderArchive()}
async function deleteSticker(i){if(!confirm('ステッカーを削除しますか？'))return;state.data.stickers.splice(i,1);await save();render()}
const collections={relations:['関係性','RELATIONS',[['関係名','title'],['A→B','ab'],['B→A','ba'],['出会い・経緯','history'],['詳細','detail']], 'relation'],worlds:['世界観','WORLDS',[['名称','title'],['分類','category'],['概要','summary'],['詳細設定','detail'],['関連キャラクター','characters']], 'world'],music:['音楽','MUSIC',[['曲名','title'],['アーティスト','artist'],['URL','url'],['イメージ・解釈','notes']], 'music'],archive:['資料室','ARCHIVE',[['タイトル','title'],['分類','category'],['内容','body'],['タグ','tags']], 'archive']};
function charById(id){return state.data.characters.find(c=>c.id===id)}
function charByName(name){return state.data.characters.find(c=>c.name===name)}
function relationCharValue(item,key){let raw=item[key]||'';return charById(raw)?.id || charByName(raw)?.id || ''}
function charChip(c){if(!c)return '<span class="muted">未選択</span>';return `<span class="linked-char">${c.images?.[0]?`<img src="${c.images[0]}">`:''}${esc(c.name)}</span>`}
function personTile(c){return `<div class="person-chip">${c?.images?.[0]?`<img src="${c.images[0]}">`:`<div style="width:58px;height:58px;border-radius:50%;background:var(--pale);margin:0 auto 7px;display:grid;place-items:center;color:var(--blue)">♙</div>`}<strong>${esc(c?.name||'未選択')}</strong></div>`}
function renderCollection(){let [name,en,fs]=collections[state.page];let a=document.getElementById('app');a.innerHTML=pageTitle(name,en,`<button class="primary" onclick="addCollection()">＋ 追加</button>`)+`<div class="toolbar"><input id="searchBox" placeholder="検索…" autocomplete="off" enterkeyhint="search" value="${esc(state.search)}" oninput="onSearch(this.value)"></div><div id="listArea">${collectionListHTML()}</div>`}
function musicChars(x){let ids=Array.isArray(x.characterIds)?x.characterIds:[];let found=ids.map(charById).filter(Boolean);if(!found.length&&x.character){let c=charById(x.character)||charByName(x.character);if(c)found=[c]}return found}
function collectionCard(x){if(state.page==='relations'){let ca=charById(x.a)||charByName(x.a),cb=charById(x.b)||charByName(x.b);return `<section class="panel relation-card"><div class="relation-pair">${personTile(ca)}<div class="relation-mark">↔</div>${personTile(cb)}</div><div class="relation-title">${esc(x.title||'関係性')}</div><div class="relation-sub">${esc(x.ab||'')} ${x.ba?' ／ '+esc(x.ba):''}</div>${x.history?`<div class="detail-section"><p>${esc(x.history)}</p></div>`:''}${x.detail?`<div class="detail-section"><p>${esc(x.detail)}</p></div>`:''}<div class="actions"><button onclick="editCollection('${x.id}')">編集</button><button class="danger" onclick="deleteItem('relations','${x.id}')">削除</button></div></section>`}
 if(state.page==='music'){let chars=musicChars(x);return `<section class="panel music-card"><div class="music-cover">♫</div><div><h3>${esc(x.title||'無題')}</h3><div class="muted">${esc(x.artist||'アーティスト未設定')}</div><div class="linked-chars">${chars.map(charChip).join('')||'<span class="muted">関連キャラなし</span>'}</div>${x.notes?`<p style="white-space:pre-wrap;font-size:13px;line-height:1.6">${esc(x.notes)}</p>`:''}${musicLinkHTML(x.url)}<div class="actions" style="margin-top:9px"><button onclick="editCollection('${x.id}')">編集</button><button class="danger" onclick="deleteItem('music','${x.id}')">削除</button></div></div></section>`}
 return `<section class="panel"><h3>${esc(x.title||x.category||'')}</h3><div class="muted">${esc(x.category||'')}</div>${x.characters?`<div class="muted">関連：${esc(x.characters)}</div>`:''}<p style="white-space:pre-wrap;font-size:13px">${esc(x.summary||x.detail||x.notes||x.body||'')}</p>${x.summary&&x.detail?`<p style="white-space:pre-wrap;font-size:13px">${esc(x.detail)}</p>`:''}<div class="actions"><button onclick="editCollection('${x.id}')">編集</button><button class="danger" onclick="deleteItem('${state.page}','${x.id}')">削除</button></div></section>`}
function addCollection(id=null){window.scrollTo(0,0);let fs=collections[state.page][2],old=state.data[state.page].find(x=>x.id===id)||{},a=document.getElementById('app');let body='';
 if(state.page==='relations'){
  let aid=relationCharValue(old,'a'),bid=relationCharValue(old,'b');
  body=`<div class="field full"><label>キャラクター A</label><select name="a" required><option value="">キャラクターを選択</option>${state.data.characters.map(c=>`<option value="${esc(c.id)}" ${c.id===aid?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field full"><label>キャラクター B</label><select name="b" required><option value="">キャラクターを選択</option>${state.data.characters.map(c=>`<option value="${esc(c.id)}" ${c.id===bid?'selected':''}>${esc(c.name)}</option>`).join('')}</select><div class="select-note">登録済みキャラクターから選択します。AとBは別のキャラクターを選んでください。</div></div>`+fs.map(([l,k])=>`<div class="field ${['detail','history','ab','ba'].includes(k)?'full':''}"><label>${l}</label>${['detail','history','ab','ba'].includes(k)?`<textarea name="${k}">${esc(old[k]||'')}</textarea>`:`<input name="${k}" value="${esc(old[k]||'')}">`}</div>`).join('');
 } else if(state.page==='music'){
  let selected=musicChars(old).map(c=>c.id);
  body=`<div class="field full"><label>関連キャラクター</label><div class="check-list">${state.data.characters.map(c=>`<label class="check-option"><input type="checkbox" name="characterIds" value="${esc(c.id)}" ${selected.includes(c.id)?'checked':''}>${esc(c.name)}</label>`).join('')||'<span class="muted">先にキャラクターを登録してください</span>'}</div><div class="select-note">複数選択できます。キャラを選ばずに曲だけ登録することもできます。</div></div>`+fs.map(([l,k])=>`<div class="field ${k==='notes'?'full':''}"><label>${k==='url'?'音楽リンク（URL）':l}</label>${k==='notes'?`<textarea name="${k}">${esc(old[k]||'')}</textarea>`:`<input name="${k}" ${k==='url'?'type="text" inputmode="url" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="https://youtu.be/…　／　https://open.spotify.com/…"':''} value="${esc(old[k]||'')}">`}${k==='url'?'<div class="tiny-note">Spotify・YouTube・Apple Music・SoundCloud・ニコニコ動画など、どのサービスのURLでも登録できます（https:// は省略してもOK）。</div>':''}</div>`).join('');
 } else {
  body=fs.map(([l,k])=>`<div class="field ${['detail','summary','body','notes'].includes(k)?'full':''}"><label>${l}</label>${['detail','summary','body','notes'].includes(k)?`<textarea name="${k}">${esc(old[k]||'')}</textarea>`:`<input name="${k}" value="${esc(old[k]||'')}">`}</div>`).join('');
 }
 a.innerHTML=pageTitle(id?'編集':'新規登録',collections[state.page][1])+`<form class="panel" onsubmit="saveCollection(event,'${id||''}')"><div class="formgrid">${body}</div><div class="actions"><button class="primary">保存</button><button type="button" onclick="render()">戻る</button></div></form>`;
}
function editCollection(id){addCollection(id)}
async function saveCollection(e,id){e.preventDefault();let fd=new FormData(e.target),obj={};for(let [k,v] of fd.entries()){if(k==='characterIds'){(obj.characterIds ||= []).push(v)}else obj[k]=v}if(state.page==='relations'&&obj.a===obj.b){alert('別々のキャラクターを選択してください');return}if(state.page==='music'){obj.characterIds ||= [];delete obj.character}if(state.page==='music'){const raw=String(obj.url||'').trim();if(raw){const n=normalizeUrl(raw);if(!n){alert('URLの形式を確認してください（例：https://youtu.be/xxxx）');return}obj.url=n}else obj.url=''}obj.id=id||uid();let arr=state.data[state.page],i=arr.findIndex(x=>x.id===obj.id);if(i<0)arr.push(obj);else arr[i]=obj;await save();render()}
async function deleteItem(type,id){if(!confirm('削除しますか？'))return;state.data[type]=state.data[type].filter(x=>x.id!==id);await save();state.detail=null;render()}
document.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||Math.random()>.22)return;const s=document.createElement('span');s.className='cursor-spark';s.textContent=['✦','♡','✧'][Math.floor(Math.random()*3)];s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),700)});
loadAppearance();
load();
</script>
</body></html>
